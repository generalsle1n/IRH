name: "Build Release and Push to Release"

env:
  CurrentDotnetVersion: 9
  InstallVPKCommand: "dotnet tool install -g vpk"
  PublishIRHCLI: "dotnet publish IRH\\IRH.csproj"
  PublishIRHCLIReleaseFolder: "IRH\\bin\\Release\\net9.0\\publish\\"
  DefaultNextReleaseMode: "patch"
  IRHCLIPackedName: "IRH-win-Setup.exe"
  IRHCLIPackedFolder: "IRH\\Release\\"
  
on:
  push:
    branches: 
      - "master"
      - "Issue#62"

jobs:
  build_win-x64:
    #runs-on: "windows-latest" 
    runs-on: "self-hosted"
    steps:
      #Clone Repository
      - uses: actions/checkout@v6.0.1
        with:
          lfs: true
          
      #Install .Net with Version 9.X
      - name: CreateDotNetEnvironment
        uses: actions/setup-dotnet@v5
        with: 
          dotnet-version: ${{ env.CurrentDotnetVersion }}

      #Build
      - name: BuildIRH
        run: ${{ env.PublishIRHCLI }}
        
      #Install DotnetTool
      - name: InstallVeloPack
        run: ${{ env.InstallVPKCommand }}
      
      #Get Version from Release  
      - name: GetVersion
        id: GetVersion
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}

      #Increase Version from Release
      - name: IncreaseRelease
        id: IncreaseRelease
        uses: christian-draeger/increment-semantic-version@1.2.3
        with:
          current-version: ${{ steps.GetVersion.outputs.release }}
          version-fragment: ${{ env.DefaultNextReleaseMode }}

      #Pack Application
      - name: CreateVeloPackRelease
        run: "vpk pack --packId IRH --packVersion ${{ steps.IncreaseRelease.outputs.next-version }} --packDir ${{ env.PublishIRHCLIReleaseFolder }}"

      #Upload to Artifacts
      - name: UploadInstaller
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IRHCLIPackedName }}
          path: ${{ env.IRHCLIPackedFolder }}${{ env.IRHCLIPackedName }}
