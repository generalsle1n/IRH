name: "Build Release and Push to Release"

env:
  CurrentDotnetVersion: 9
  InstallVPKCommand: "dotnet tool install -g vpk"
  PublishIRHCLI: "dotnet publish IRH\\IRH.csproj"
  PublishIRHCLIReleaseFolder: "IRH\\bin\\Release\\net9.0\\publish\\"
  DefaultNextReleaseMode: "patch"
  IRHCLIPackedName: "IRH-win-Setup.exe"
  IRHCLIPackedFolder: "Releases\\"
  
on:
  push:
    branches: 
      - "master"
      - "Issue#62"

jobs:
  win-64:
    uses: "./.github/workflows/buildAndUploud_win-x64.yml"
    with: 
      dotnetVersion: 9
      nextReleaseMode: patch
  release:
    needs: win-64
    runs-on: self-hosted
    steps:
      - name: CreateRelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.IncreaseRelease.outputs.next-version }}
          generate_release_notes: true
          make_latest: true
          files: ${{ inputs.irhCliPackedFolder }}${{ inputs.irhCliPackName }}
