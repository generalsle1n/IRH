name: Create Release
on:
  workflow_call:
    inputs:
      nextVersion:
        type: string
        required: true

env: 
  BinaryPatternName: "IRH-*-Setup.*"
  
jobs:
  createRelease:
    name: Create Release
    
    permissions: 
      contents: write
    
    runs-on: self-hosted
    
    steps:
      - name: Download Setup Files
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.BinaryPatternName }}
      
      - name: CreateRelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.nextVersion }}
          generate_release_notes: true
          make_latest: true
          files: ${{ env.BinaryPatternName }}

      - name: Delete Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ env.BinaryPatternName }}

